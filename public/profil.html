<!DOCTYPE html>
<html>
<head>
  <title>Letterd - Profil</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/disposition.css">
  <link rel="stylesheet" href="styles/composants.css">
  <link rel="stylesheet" href="styles/profil.css">
</head>
<body>
  <div class="header">
    <a href="tableau-de-bord.html" class="logo">
      <h1>Letter<span class="green-d">d</span></h1>
    </a>
    <div class="auth-buttons">
      <button id="logoutBtn" class="btn-signup">Déconnexion</button>
    </div>
  </div>

  <div class="profile-page">
    <div class="profile-card">
      <h2 id="usernameLabel">Mon profil</h2>
      <div class="profile-summary">
        <p>Pseudo actuel : <span id="currentPseudo"></span></p>
        <p>Email : <span id="currentEmail"></span></p>
        <p>Créé le : <span id="createdAt"></span></p>
      </div>
      <form id="updateForm" class="profile-form">
        <input type="text" id="newPseudo" placeholder="Nouveau pseudo" required>
        <input type="password" id="currentPassword" placeholder="Mot de passe actuel" required>
        <input type="password" id="newPassword" placeholder="Nouveau mot de passe" required>
        <button type="submit">Mettre à jour</button>
      </form>
      <form id="deleteForm" class="profile-form danger-form">
        <input type="password" id="deletePassword" placeholder="Confirmer avec le mot de passe" required>
        <button type="submit">Supprimer le compte</button>
      </form>
      <p id="updateStatus"></p>
      <p id="deleteStatus"></p>
    </div>
  </div>

  <script src="scripts/profil.js"></script>
</body>
</html>
